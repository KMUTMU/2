<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#05100b; }
  #card {
    position:relative;
    width:1080px; height:1440px;   /* exact 3:4 portrait */
    overflow:hidden;
    font-family:'Helvetica Neue',Arial,sans-serif;
    background:#0a1c14;
  }

  /* ===== BACKGROUND CARD PHOTOS (all three, blended) ===== */
  .bg { position:absolute; inset:0; background-size:cover; background-position:center; }

  /* Sissoko Prizm — smaller, upper-center, feathered into bg */
  .bg-prizm {
    background-image:url('s-l1600.jpg');
    background-position:center top;
    background-size:auto 48%;            /* smaller player */
    background-repeat:no-repeat;
    filter:grayscale(14%) contrast(1.05) brightness(0.62) saturate(1.05);
    -webkit-mask-image: radial-gradient(52% 40% at 50% 22%, #000 0%, #000 40%, transparent 74%);
            mask-image: radial-gradient(52% 40% at 50% 22%, #000 0%, #000 40%, transparent 74%);
    opacity:0.85;
  }
  /* faint vintage MATCH scene texture across the whole bg (very subtle) */
  .bg-match {
    background-image:url('1656900916111.jpg');
    background-position:38% 48%;
    background-size:130%;
    background-repeat:no-repeat;
    filter:sepia(0.9) contrast(1.1) brightness(0.9);
    -webkit-mask-image: radial-gradient(120% 50% at 50% 100%, #000 0%, #000 20%, transparent 55%);
            mask-image: radial-gradient(120% 50% at 50% 100%, #000 0%, #000 20%, transparent 55%);
    opacity:0.28; mix-blend-mode:luminosity;
  }
  .bg-portrait { display:none; }

  /* ===== displayed vintage cards (crisp, like a collection) ===== */
  .vcards { position:absolute; left:0; right:0; bottom:300px; display:flex; justify-content:center; align-items:center; pointer-events:none; }
  .vcard { border:4px solid #efe3c6; border-radius:4px;
    box-shadow:0 12px 32px rgba(0,0,0,0.75), 0 0 0 1px #9c7326;
    filter:sepia(0.3) contrast(1.06) brightness(1.05);
    background-repeat:no-repeat; }
  /* MATCH slab 1755x1080: crop the dark card (x 29%..78%, y 22%..76%) */
  .vcard.match {
    width:300px; height:196px; transform:rotate(-5deg) translateX(36px); z-index:1;
    background-image:url('1656900916111.jpg');
    background-size:204% auto;
    background-position:44% 40%;
  }
  /* PORTRAIT slab 1080x1713: crop the dark card (x 22%..78%, y 30%..78%) */
  .vcard.portrait {
    width:158px; height:250px; transform:rotate(5deg) translateX(-36px); z-index:2;
    background-image:url('1656900919275.jpg');
    background-size:178% auto;
    background-position:50% 47%;
  }
  .vcards::after { content:""; position:absolute; inset:-30px;
    background:radial-gradient(60% 90% at 50% 50%, rgba(217,182,78,0.16), transparent 70%); z-index:0; }

  /* ===== TONE OVERLAYS ===== */
  .tone-green { position:absolute; inset:0;
    background:
      radial-gradient(90% 55% at 50% 30%, rgba(20,70,50,0.45), transparent 68%),
      linear-gradient(180deg, rgba(6,20,14,0.45) 0%, rgba(6,20,14,0.2) 42%, rgba(4,14,9,0.55) 100%);
    mix-blend-mode:multiply; }
  .tone-dark { position:absolute; inset:0;
    background:
      linear-gradient(90deg, rgba(4,14,9,0.9) 0%, rgba(4,14,9,0) 14%, rgba(4,14,9,0) 86%, rgba(4,14,9,0.9) 100%),
      linear-gradient(180deg, rgba(0,0,0,0.4), rgba(0,0,0,0.05) 34%, rgba(0,0,0,0.35) 100%); }
  .prizm-streak { position:absolute; inset:0;
    background:linear-gradient(115deg, transparent 33%, rgba(126,249,255,0.08) 47%, rgba(167,139,250,0.1) 50%, rgba(244,114,182,0.08) 53%, transparent 67%);
    mix-blend-mode:screen; opacity:0.5; }
  .top-bar { position:absolute; top:0; left:0; right:0; height:9px;
    background:linear-gradient(90deg,#7ef9ff,#a78bfa,#f472b6,#facc15,#34d399); opacity:0.9; }

  /* ===== GOLD FRAME ===== */
  .frame { position:absolute; inset:44px; border:3px solid;
    border-image:linear-gradient(135deg,#f4e2a6,#d9b64e,#b8892e,#e7c96b) 1; pointer-events:none; }
  .frame-inner { position:absolute; inset:60px; border:1px solid rgba(231,201,107,0.45); pointer-events:none; }

  /* ===== CONTENT ===== */
  .content { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:space-between; padding:140px 0 130px; }

  /* EPL logo — SMALL and blended into the background (no bright disc), low opacity */
  .epl-wrap { width:170px; height:95px; display:flex; align-items:center; justify-content:center; }
  .epl-wrap img { max-width:100%; max-height:100%; opacity:0.4;
    filter:brightness(1.45) saturate(0.85) drop-shadow(0 2px 6px rgba(0,0,0,0.5)); }

  .mid { display:flex; flex-direction:column; align-items:center; }

  .wordmark {
    margin-top:0;
    font-family:Georgia,'Times New Roman',serif; font-weight:bold; font-size:140px; line-height:1; letter-spacing:4px;
    background:linear-gradient(135deg,#f9edb8,#d9b64e 40%,#b8892e 66%,#f0d987);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 4px 20px rgba(0,0,0,0.55);
  }
  .rule { display:flex; align-items:center; gap:16px; margin-top:10px; }
  .rule .line { width:190px; height:2px; background:linear-gradient(90deg,transparent,#d9b64e,transparent); }
  .rule .dot { width:13px; height:13px; transform:rotate(45deg); background:#d9b64e; }
  .sub { margin-top:14px; color:#f4e9cf; font-size:36px; letter-spacing:18px; font-weight:600; text-shadow:0 2px 8px #000; }

  /* Tottenham logo on a soft light disc (keep this crisp — it's the dealer's club) */
  .spurs-wrap { margin-top:20px; width:200px; height:215px; display:flex; align-items:center; justify-content:center; position:relative; }
  .spurs-wrap::before { content:""; position:absolute; width:200px; height:220px;
    background:radial-gradient(ellipse at center, rgba(244,233,207,0.88), rgba(244,233,207,0.6) 42%, transparent 70%);
    border-radius:50%; }
  .spurs-wrap img { max-width:76%; max-height:92%; position:relative;
    filter:contrast(1.08) drop-shadow(0 2px 6px rgba(0,0,0,0.35)); }

  .bottom { display:flex; flex-direction:column; align-items:center; }
  .chips { display:flex; gap:22px; }
  .chip { border:2px solid #d9b64e; border-radius:44px; padding:16px 34px;
    color:#f4e9cf; font-size:28px; font-weight:600; letter-spacing:3px; background:rgba(6,20,14,0.4); text-shadow:0 1px 4px #000; }
  .chip b { color:#e7c96b; }

  .tagline { margin-top:28px; color:#e7c96b; font-size:26px; letter-spacing:8px; font-weight:400; text-shadow:0 2px 8px #000; }
</style>
</head>
<body>
<div id="card">
  <!-- all three real cards blended -->
  <div class="bg bg-prizm"></div>
  <div class="bg bg-match"></div>
  <div class="bg bg-portrait"></div>

  <div class="tone-green"></div>
  <div class="tone-dark"></div>
  <div class="prizm-streak"></div>
  <div class="top-bar"></div>

  <!-- crisp vintage cards displayed like a collection -->
  <div class="vcards">
    <div class="vcard portrait"></div>
    <div class="vcard match"></div>
  </div>

  <div class="frame"></div>
  <div class="frame-inner"></div>

  <div class="content">
    <div class="epl-wrap"><img src="epl_logo.png" alt="EPL"></div>

    <div class="mid">
      <div class="wordmark">VINTAGE</div>
      <div class="rule"><span class="line"></span><span class="dot"></span><span class="line"></span></div>
      <div class="sub">SPORTS CARDS</div>
      <div class="spurs-wrap"><img src="spurs_logo.png" alt="Tottenham"></div>
    </div>

    <div class="bottom">
      <div class="chips">
        <div class="chip">EPL</div>
        <div class="chip">PANINI <b>PRIZM</b></div>
        <div class="chip">VINTAGE</div>
      </div>
      <div class="tagline">VINTAGE · PRIZM · TOBACCO CARDS</div>
    </div>
  </div>
</div>
</body>
</html>
