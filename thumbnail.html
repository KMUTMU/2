<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#05100b; }
  #card {
    position:relative;
    width:900px; height:1200px;
    overflow:hidden;
    font-family:'Helvetica Neue',Arial,sans-serif;
    background:#0a1c14;
  }

  /* ===== BACKGROUND: Sissoko Prizm blended in (kept — user liked it) ===== */
  .bg { position:absolute; inset:0; background-size:cover; background-position:center; }
  .bg-prizm {
    background-image:url('s-l1600.jpg');
    background-position:center 18%;
    filter:grayscale(12%) contrast(1.05) brightness(0.6) saturate(1.1);
    transform:scale(1.3);
  }
  /* vintage match scene faded at the very bottom for texture */
  .bg-match {
    background-image:url('1656900916111.jpg');
    background-position:38% 48%;
    background-size:190%;
    filter:sepia(0.92) contrast(1.15) brightness(0.95);
    -webkit-mask-image: radial-gradient(120% 60% at 50% 100%, #000 0%, #000 22%, transparent 58%);
            mask-image: radial-gradient(120% 60% at 50% 100%, #000 0%, #000 22%, transparent 58%);
    opacity:0.5; mix-blend-mode:luminosity;
  }

  /* ===== TONE OVERLAYS ===== */
  .tone-green { position:absolute; inset:0;
    background:
      radial-gradient(90% 70% at 50% 32%, rgba(20,70,50,0.5), transparent 70%),
      linear-gradient(180deg, rgba(6,20,14,0.5) 0%, rgba(6,20,14,0.25) 40%, rgba(4,14,9,0.88) 100%);
    mix-blend-mode:multiply; }
  .tone-dark { position:absolute; inset:0;
    background:
      linear-gradient(90deg, rgba(4,14,9,0.9) 0%, rgba(4,14,9,0) 15%, rgba(4,14,9,0) 85%, rgba(4,14,9,0.9) 100%),
      linear-gradient(180deg, rgba(0,0,0,0.5), rgba(0,0,0,0.12) 32%, rgba(0,0,0,0.62) 100%); }
  .prizm-streak { position:absolute; inset:0;
    background:linear-gradient(115deg, transparent 32%, rgba(126,249,255,0.09) 46%, rgba(167,139,250,0.11) 50%, rgba(244,114,182,0.09) 54%, transparent 68%);
    mix-blend-mode:screen; opacity:0.55; }
  .top-bar { position:absolute; top:0; left:0; right:0; height:8px;
    background:linear-gradient(90deg,#7ef9ff,#a78bfa,#f472b6,#facc15,#34d399); opacity:0.9; }

  /* ===== GOLD FRAME ===== */
  .frame { position:absolute; inset:38px; border:3px solid;
    border-image:linear-gradient(135deg,#f4e2a6,#d9b64e,#b8892e,#e7c96b) 1; pointer-events:none; }
  .frame-inner { position:absolute; inset:52px; border:1px solid rgba(231,201,107,0.45); pointer-events:none; }

  /* ===== CONTENT ===== */
  .content { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }

  /* real EPL logo (transparent PNG) on a soft light disc so navy reads crisply */
  .epl-wrap { width:340px; height:180px; display:flex; align-items:center; justify-content:center; position:relative; }
  .epl-wrap::before { content:""; position:absolute; width:330px; height:170px;
    background:radial-gradient(ellipse at center, rgba(244,233,207,0.92), rgba(244,233,207,0.7) 45%, transparent 72%);
    border-radius:50%; }
  .epl-wrap img { max-width:94%; max-height:94%; position:relative;
    filter:contrast(1.08) drop-shadow(0 2px 6px rgba(0,0,0,0.35)); }

  .est { margin-top:20px; color:#e7c96b; font-size:22px; letter-spacing:11px; font-weight:400; text-shadow:0 2px 8px #000; }

  .wordmark {
    margin-top:16px;
    font-family:Georgia,'Times New Roman',serif; font-weight:bold; font-size:118px; line-height:1; letter-spacing:3px;
    background:linear-gradient(135deg,#f9edb8,#d9b64e 40%,#b8892e 66%,#f0d987);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 4px 18px rgba(0,0,0,0.5);
  }
  .rule { display:flex; align-items:center; gap:14px; margin-top:6px; }
  .rule .line { width:160px; height:2px; background:linear-gradient(90deg,transparent,#d9b64e,transparent); }
  .rule .dot { width:12px; height:12px; transform:rotate(45deg); background:#d9b64e; }
  .sub { margin-top:12px; color:#f4e9cf; font-size:30px; letter-spacing:15px; font-weight:600; text-shadow:0 2px 8px #000; }

  /* real Tottenham logo (transparent PNG) on a soft light disc */
  .spurs-wrap { margin-top:30px; width:190px; height:210px; display:flex; align-items:center; justify-content:center; position:relative; }
  .spurs-wrap::before { content:""; position:absolute; width:180px; height:200px;
    background:radial-gradient(ellipse at center, rgba(244,233,207,0.9), rgba(244,233,207,0.65) 42%, transparent 70%);
    border-radius:50%; }
  .spurs-wrap img { max-width:78%; max-height:94%; position:relative;
    filter:contrast(1.08) drop-shadow(0 2px 6px rgba(0,0,0,0.35)); }

  .chips { display:flex; gap:18px; margin-top:30px; }
  .chip { border:2px solid #d9b64e; border-radius:40px; padding:13px 28px;
    color:#f4e9cf; font-size:23px; font-weight:600; letter-spacing:3px; background:rgba(6,20,14,0.4); text-shadow:0 1px 4px #000; }
  .chip b { color:#e7c96b; }

  .tagline { margin-top:24px; color:#e7c96b; font-size:22px; letter-spacing:7px; font-weight:400; text-shadow:0 2px 8px #000; }
</style>
</head>
<body>
<div id="card">
  <div class="bg bg-prizm"></div>
  <div class="bg bg-match"></div>

  <div class="tone-green"></div>
  <div class="tone-dark"></div>
  <div class="prizm-streak"></div>
  <div class="top-bar"></div>

  <div class="frame"></div>
  <div class="frame-inner"></div>

  <div class="content">
    <!-- REAL EPL logo (transparent) -->
    <div class="epl-wrap"><img src="epl_logo.png" alt="EPL"></div>

    <div class="est">EST. COLLECTION</div>

    <div class="wordmark">VINTAGE</div>
    <div class="rule"><span class="line"></span><span class="dot"></span><span class="line"></span></div>
    <div class="sub">SPORTS CARDS</div>

    <!-- REAL Tottenham logo (transparent) -->
    <div class="spurs-wrap"><img src="spurs_logo.png" alt="Tottenham"></div>

    <div class="chips">
      <div class="chip">EPL</div>
      <div class="chip">PANINI <b>PRIZM</b></div>
      <div class="chip">VINTAGE</div>
    </div>
    <div class="tagline">VINTAGE · PRIZM · TOBACCO CARDS</div>
  </div>
</div>
</body>
</html>
