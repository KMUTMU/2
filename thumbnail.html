<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Oswald:wght@500;600;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#05100b; }
  #card {
    position:relative;
    width:900px; height:1200px;
    overflow:hidden;
    font-family:'Oswald','Helvetica Neue',Arial,sans-serif;
    background:#0a1c14;
  }

  /* ===== BACKGROUND PHOTO LAYERS (real images blended in) ===== */
  .bg { position:absolute; inset:0; background-size:cover; background-position:center; }

  /* Prizm player as the main hero background */
  .bg-prizm {
    background-image:url('s-l1600.jpg');
    background-position:center 20%;
    filter:grayscale(15%) contrast(1.05) brightness(0.62) saturate(1.1);
    transform:scale(1.25);
  }
  /* vintage match scene, lower area, sepia, faded — zoom into the photo, crop out Ogden's label */
  .bg-match {
    background-image:url('1656900916111.jpg');
    background-position:38% 48%;
    background-size:190%;
    filter:sepia(0.92) contrast(1.15) brightness(0.95);
    -webkit-mask-image: radial-gradient(130% 85% at 42% 90%, #000 0%, #000 30%, transparent 60%);
            mask-image: radial-gradient(130% 85% at 42% 90%, #000 0%, #000 30%, transparent 60%);
    opacity:0.6;
    mix-blend-mode:luminosity;
  }
  /* vintage portrait, upper-right, sepia, faded — zoom into the face, skip the SGC label */
  .bg-portrait {
    background-image:url('1656900919275.jpg');
    background-position:center 55%;
    background-size:160%;
    filter:sepia(0.9) contrast(1.05) brightness(0.95);
    -webkit-mask-image: radial-gradient(58% 48% at 82% 22%, #000 0%, #000 16%, transparent 50%);
            mask-image: radial-gradient(58% 48% at 82% 22%, #000 0%, #000 16%, transparent 50%);
    opacity:0.4;
    mix-blend-mode:luminosity;
  }
  /* darken the upper-right corner further so any residual label text disappears */
  .corner-fade {
    position:absolute; inset:0;
    background:radial-gradient(40% 30% at 88% 12%, rgba(4,14,9,0.9), transparent 70%);
  }

  /* ===== COLOR / TONE OVERLAYS ===== */
  .tone-green {
    position:absolute; inset:0;
    background:
      radial-gradient(90% 70% at 50% 30%, rgba(20,70,50,0.55), transparent 70%),
      linear-gradient(180deg, rgba(6,20,14,0.55) 0%, rgba(6,20,14,0.30) 40%, rgba(4,14,9,0.85) 100%);
    mix-blend-mode:multiply;
  }
  .tone-dark {
    position:absolute; inset:0;
    background:
      linear-gradient(90deg, rgba(4,14,9,0.95) 0%, rgba(4,14,9,0) 16%, rgba(4,14,9,0) 84%, rgba(4,14,9,0.95) 100%),
      linear-gradient(180deg, rgba(0,0,0,0.55), rgba(0,0,0,0.15) 35%, rgba(0,0,0,0.6) 100%);
  }
  /* subtle prizm holo streak, used sparingly */
  .prizm-streak {
    position:absolute; inset:0;
    background:linear-gradient(115deg, transparent 30%, rgba(126,249,255,0.10) 45%, rgba(167,139,250,0.12) 50%, rgba(244,114,182,0.10) 55%, transparent 70%);
    mix-blend-mode:screen;
    opacity:0.6;
  }
  /* top prizm accent bar */
  .top-bar { position:absolute; top:0; left:0; right:0; height:8px;
    background:linear-gradient(90deg,#7ef9ff,#a78bfa,#f472b6,#facc15,#34d399); opacity:0.9; }

  /* ===== GOLD FRAME ===== */
  .frame { position:absolute; inset:38px; border:3px solid;
    border-image:linear-gradient(135deg,#f4e2a6,#d9b64e,#b8892e,#e7c96b) 1;
    border-radius:2px; pointer-events:none; }
  .frame-inner { position:absolute; inset:52px; border:1px solid rgba(231,201,107,0.45); pointer-events:none; }

  /* ===== TEXT / BRANDING ===== */
  .content { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .est { color:#e7c96b; font-size:22px; letter-spacing:11px; font-weight:500; text-shadow:0 2px 8px #000; }

  /* EPL-style emblem (original, lion+crown motif) */
  .epl { margin-top:26px; width:150px; height:150px; filter:drop-shadow(0 4px 12px rgba(0,0,0,0.6)); }

  .wordmark {
    margin-top:14px;
    font-family:'Playfair Display',Georgia,serif; font-weight:900; font-size:120px; line-height:1;
    letter-spacing:4px;
    background:linear-gradient(135deg,#f9edb8,#d9b64e 40%,#b8892e 65%,#f0d987);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 4px 18px rgba(0,0,0,0.5);
  }
  .rule { display:flex; align-items:center; gap:14px; margin-top:6px; }
  .rule .line { width:150px; height:2px; background:linear-gradient(90deg,transparent,#d9b64e,transparent); }
  .rule .dot { width:12px; height:12px; transform:rotate(45deg); background:#d9b64e; }
  .sub { margin-top:12px; color:#f4e9cf; font-size:30px; letter-spacing:15px; font-weight:600; text-shadow:0 2px 8px #000; }

  /* club emblem row (original shields) */
  .clubs { display:flex; gap:32px; margin-top:34px; }
  .clubs svg { width:74px; height:90px; filter:drop-shadow(0 4px 10px rgba(0,0,0,0.8)); }

  /* chips */
  .chips { display:flex; gap:20px; margin-top:46px; margin-bottom:0; }
  .chip { border:2px solid #d9b64e; border-radius:40px; padding:14px 30px;
    color:#f4e9cf; font-size:24px; font-weight:600; letter-spacing:3px;
    background:rgba(6,20,14,0.45); backdrop-filter:blur(2px); text-shadow:0 1px 4px #000; }
  .chip b { color:#e7c96b; }

  .tagline { color:#e7c96b; font-size:22px; letter-spacing:7px; margin-top:26px; font-weight:500; text-shadow:0 2px 8px #000; }
</style>
</head>
<body>
<div id="card">
  <!-- real photo backgrounds -->
  <div class="bg bg-prizm"></div>
  <div class="bg bg-match"></div>
  <div class="bg bg-portrait"></div>
  <div class="corner-fade"></div>

  <!-- tone overlays -->
  <div class="tone-green"></div>
  <div class="tone-dark"></div>
  <div class="prizm-streak"></div>
  <div class="top-bar"></div>

  <!-- frame -->
  <div class="frame"></div>
  <div class="frame-inner"></div>

  <!-- content -->
  <div class="content">
    <div class="est">EST. COLLECTION</div>

    <!-- EPL-style emblem: original lion + crown inside shield -->
    <svg class="epl" viewBox="0 0 100 100">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#4c1d95"/>
        </linearGradient>
      </defs>
      <circle cx="50" cy="50" r="47" fill="url(#g)" stroke="#e7c96b" stroke-width="2.5"/>
      <!-- crown -->
      <path d="M32 40 L38 30 L44 38 L50 26 L56 38 L62 30 L68 40 Z" fill="#e7c96b"/>
      <rect x="32" y="40" width="36" height="6" rx="2" fill="#e7c96b"/>
      <!-- lion silhouette -->
      <path d="M40 52 q10 -6 20 0 q3 8 -2 14 q4 2 3 8 l-6 0 q0 -4 -3 -6 q-4 2 -8 0 q-3 2 -3 6 l-6 0 q-1 -6 3 -8 q-5 -6 -2 -14 Z" fill="#f4e9cf"/>
      <circle cx="52" cy="56" r="1.6" fill="#4c1d95"/>
      <text x="50" y="90" text-anchor="middle" font-family="Oswald" font-size="10" font-weight="700" fill="#e7c96b" letter-spacing="2">EPL</text>
    </svg>

    <div class="wordmark">VINTAGE</div>
    <div class="rule"><span class="line"></span><span class="dot"></span><span class="line"></span></div>
    <div class="sub">SPORTS CARDS</div>

    <!-- original club shields (big-club feel, not real trademarks) -->
    <div class="clubs">
      <!-- red club -->
      <svg viewBox="0 0 66 80"><path d="M4 6 h58 v40 q0 22 -29 32 q-29 -10 -29 -32 Z" fill="#c8102e" stroke="#e7c96b" stroke-width="2.5"/><circle cx="33" cy="34" r="13" fill="none" stroke="#fff" stroke-width="2.5"/><path d="M33 22 v24 M21 34 h24" stroke="#fff" stroke-width="2.5"/></svg>
      <!-- navy/white club -->
      <svg viewBox="0 0 66 80"><path d="M4 6 h58 v40 q0 22 -29 32 q-29 -10 -29 -32 Z" fill="#132257" stroke="#e7c96b" stroke-width="2.5"/><circle cx="33" cy="30" r="9" fill="#fff"/><path d="M28 42 h10 l-2 22 h-6 Z" fill="#fff"/></svg>
      <!-- sky-blue club -->
      <svg viewBox="0 0 66 80"><path d="M4 6 h58 v40 q0 22 -29 32 q-29 -10 -29 -32 Z" fill="#6cabdd" stroke="#e7c96b" stroke-width="2.5"/><path d="M33 16 l16 10 v14 q0 14 -16 22 q-16 -8 -16 -22 v-14 Z" fill="none" stroke="#fff" stroke-width="2.5"/><path d="M25 40 h16 M33 30 v20" stroke="#fff" stroke-width="2.2"/></svg>
      <!-- blue club -->
      <svg viewBox="0 0 66 80"><path d="M4 6 h58 v40 q0 22 -29 32 q-29 -10 -29 -32 Z" fill="#034694" stroke="#e7c96b" stroke-width="2.5"/><path d="M33 18 q10 6 10 18 q0 12 -10 22 q-10 -10 -10 -22 q0 -12 10 -18 Z" fill="none" stroke="#fff" stroke-width="2.5"/></svg>
    </div>

    <div class="chips">
      <div class="chip">EPL</div>
      <div class="chip">PANINI <b>PRIZM</b></div>
      <div class="chip">VINTAGE</div>
    </div>
    <div class="tagline">VINTAGE · PRIZM · TOBACCO CARDS</div>
  </div>
</div>
</body>
</html>
